# Render blueprint para el bot de compras Mercaldas.
# Root dir: bot/
services:
  - type: web
    name: mcaldas-shopping-bot
    runtime: python
    rootDir: bot
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: CORS_ORIGIN
        sync: false
