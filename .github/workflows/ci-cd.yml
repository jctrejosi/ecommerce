name: CI/CD

# CI valida cualquier cambio en dev y master (push o PR hacia master). El
# despliegue solo corre en push/manual sobre dev, después de que CI pase.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

# Un grupo por ref: los pushes a master se encolan (no se cancelan) para no
# dejar el servidor a medio desplegar. Los PR pueden cancelarse entre sí.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build de las imágenes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      # Un .env de CI con valores públicos; los secretos reales viven solo en
      # el servidor (docker/.env no se versiona).
      - name: Preparar .env de CI
        run: cp docker/.env.example docker/.env

      # Compila EXACTAMENTE las imágenes que se despliegan: backend NestJS, bot
      # FastAPI, las 4 SPAs Vite (una imagen por interfaz) y el proxy Caddy.
      # No publica nada.
      - name: Construir imágenes de producción
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ecommerce-api.jcti.xyz' }}
          VITE_BOT_API_URL: ''
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ vars.VITE_GOOGLE_REDIRECT_URI }}
        run: |
          set -Eeuo pipefail
          docker compose -f docker/docker-compose.yml --env-file docker/.env build

  deploy:
    name: Desplegar en el VPS
    needs: ci
    # El despliegue automático lo hace el timer del VPS (jcti-autodeploy).
    # Con runner self-hosted, define SELF_HOSTED_DEPLOY=true en el repo.
    if: >-
      vars.SELF_HOSTED_DEPLOY == 'true' &&
      needs.ci.result == 'success' &&
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, mercaldas]
    timeout-minutes: 45
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Desplegar commit
        env:
          # Ruta del clon de producción en el servidor. Se puede sobreescribir
          # con la variable de repositorio DEPLOY_PATH.
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/deploy/ecommerce' }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -d "$DEPLOY_PATH" || {
            echo "No existe DEPLOY_PATH=$DEPLOY_PATH" >&2
            exit 1
          }
          bash "$DEPLOY_PATH/deploy/deploy.sh" "$TARGET_SHA"
