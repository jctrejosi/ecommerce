name: CI/CD

# CI valida cualquier cambio en dev y master (push o PR hacia master). El
# despliegue solo corre en push/manual sobre dev, después de que CI pase.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

# Un grupo por ref: los pushes a master se encolan (no se cancelan) para no
# dejar el servidor a medio desplegar. Los PR pueden cancelarse entre sí.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build de la imagen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      # Compila EXACTAMENTE la imagen que se despliega: backend NestJS, las 4
      # interfaces Vite y el runtime (bot + Caddy). No publica nada.
      - name: Construir imagen de producción
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: false
          build-args: |
            VITE_API_URL=${{ vars.PUBLIC_APP_URL || 'https://mercaldas.jcti.xyz' }}
            VITE_BOT_API_URL=
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_GOOGLE_REDIRECT_URI=${{ vars.VITE_GOOGLE_REDIRECT_URI }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en el VPS
    needs: ci
    if: >-
      needs.ci.result == 'success' &&
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, mercaldas]
    timeout-minutes: 45
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Desplegar commit
        env:
          # Ruta del clon de producción en el VPS (WSL). Se puede sobreescribir
          # con la variable de repositorio DEPLOY_PATH.
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/mnt/c/Users/Desarrolo4/Documents/ecommerce' }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -d "$DEPLOY_PATH" || {
            echo "No existe DEPLOY_PATH=$DEPLOY_PATH" >&2
            exit 1
          }
          bash "$DEPLOY_PATH/deploy/deploy.sh" "$TARGET_SHA"
