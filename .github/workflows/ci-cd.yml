name: CI/CD

# CI valida cualquier cambio en dev y master (push o PR hacia master). El
# despliegue solo corre en push/manual sobre dev, después de que CI pase.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

# Un grupo por ref: los pushes a master se encolan (no se cancelan) para no
# dejar el servidor a medio desplegar. Los PR pueden cancelarse entre sí.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build de las imágenes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      # Un .env de CI con valores públicos; los secretos reales viven solo en
      # el servidor (docker/.env no se versiona).
      - name: Preparar .env de CI
        run: cp docker/.env.example docker/.env

      # Compila EXACTAMENTE las imágenes que se despliegan: backend NestJS, bot
      # FastAPI, las 4 SPAs Vite (una imagen por interfaz) y el proxy Caddy.
      # No publica nada.
      - name: Construir imágenes de producción
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ecommerce-api.jcti.xyz' }}
          VITE_BOT_API_URL: ''
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ vars.VITE_GOOGLE_REDIRECT_URI }}
        run: |
          set -Eeuo pipefail
          docker compose -f docker/docker-compose.yml --env-file docker/.env build

  test-backend:
    name: Pruebas backend (vitest + testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: backend/yarn.lock
      - name: Instalar dependencias
        run: yarn install --frozen-lockfile
        working-directory: backend
      - name: Unitarias
        run: yarn test:unit
        working-directory: backend
      - name: Integración (PostgreSQL en Testcontainers)
        run: yarn test:e2e
        working-directory: backend

  test-bot:
    name: Pruebas bot (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
        working-directory: bot
      - name: Pytest
        run: python -m pytest -q
        working-directory: bot

  test-e2e:
    name: Pruebas E2E (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Instalar dependencias de las SPAs
        run: |
          set -Eeuo pipefail
          for dir in "Interface web client" "Interface web admin" "Interface web picking admin" "Interface web delivery admin"; do
            (cd "$dir" && npm ci --no-audit --no-fund)
          done
      - name: Instalar Playwright
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Ejecutar E2E
        run: npx playwright test
        working-directory: e2e
      - name: Subir reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  deploy:
    name: Desplegar en el VPS
    needs: [ci, test-backend, test-bot, test-e2e]
    # El despliegue automático lo hace el timer del VPS (jcti-autodeploy).
    # Con runner self-hosted, define SELF_HOSTED_DEPLOY=true en el repo.
    if: >-
      vars.SELF_HOSTED_DEPLOY == 'true' &&
      needs.ci.result == 'success' &&
      needs.test-backend.result == 'success' &&
      needs.test-bot.result == 'success' &&
      needs.test-e2e.result == 'success' &&
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, mercaldas]
    timeout-minutes: 45
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Desplegar commit
        env:
          # Ruta del clon de producción en el servidor. Se puede sobreescribir
          # con la variable de repositorio DEPLOY_PATH.
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/deploy/ecommerce' }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -d "$DEPLOY_PATH" || {
            echo "No existe DEPLOY_PATH=$DEPLOY_PATH" >&2
            exit 1
          }
          bash "$DEPLOY_PATH/deploy/deploy.sh" "$TARGET_SHA"
