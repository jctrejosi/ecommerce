services:
  redis:
    image: redis:7-alpine
    container_name: mercaldas-tracking-broker
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      # 6380 para no chocar con un Redis existente en 6379.
      # Solo accesible desde el host; el broker no debe quedar expuesto a la red.
      - "127.0.0.1:6380:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - tracking-broker-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  tracking-broker-data:
