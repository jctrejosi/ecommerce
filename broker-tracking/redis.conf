# Redis para el broker de tracking (Redis Streams).
# La ingesta publica con XADD y el worker consume con XREADGROUP/XACK.

bind 0.0.0.0
# El puerto solo se publica en loopback (ver docker-compose.yml), así que se
# desactiva protected-mode: dentro del contenedor la conexión llega desde la IP
# del gateway de Docker y, si no, Redis la rechaza. En producción usar
# `requirepass` y no publicar el puerto.
protected-mode no
port 6379

# Persistencia: AOF con fsync cada segundo. Los Streams viven en memoria, así
# que sin persistencia se perderían los eventos en cola ante un reinicio.
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
dir /data

# No expulsar mensajes de la cola: si se llena, es preferible que la ingesta
# falle y se note, a perder eventos silenciosamente.
maxmemory 512mb
maxmemory-policy noeviction

# Límites de memoria por cliente (protege el broker de payloads enormes).
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit pubsub 32mb 8mb 60

# Logs
loglevel notice

# Seguridad: habilitar requirepass en producción y usar TLS/reverse proxy.
# requirepass CAMBIAR_EN_PRODUCCION
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
