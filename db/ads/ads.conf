# Configuración del servidor ADS para Linux (ads.conf).
#
# Referencia: docs.xsharp.it — "The Advantage Database Server on Linux"
#
# - LOWERCASE_ALL_PATHS=1 es OBLIGATORIO: el filesystem de Linux es sensible
#   a mayúsculas y ADS espera rutas en minúsculas.
# - DataDirectory: directorio donde están los archivos de la base (el punto
#   de montaje /data del contenedor). El nombre exacto de la clave puede
#   variar según la versión; ajústalo al leer la doc del instalador.

LOWERCASE_ALL_PATHS=1
DataDirectory=/data
