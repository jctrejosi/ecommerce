name: db

services:
  postgres:
    image: postgis/postgis:16-3.4

    container_name: ecommerce_postgres

    restart: unless-stopped

    # Publicado sólo en loopback: el backend y los scripts corren en el host.
    # Para exponerlo a la LAN, cambia 127.0.0.1 por la IP o 0.0.0.0 (con firewall).
    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - default
      - mercaldas_internal

networks:
  mercaldas_internal:
    external: true

volumes:
  postgres_data: