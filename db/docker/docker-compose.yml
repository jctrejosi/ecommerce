name: db

services:
  postgres:
    image: postgis/postgis:16-3.4

    container_name: ecommerce_postgres

    restart: unless-stopped

    # Sin `ports`: la BD solo se consume desde la red interna
    # (mercaldas_internal), nunca desde el host ni desde internet.

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - default
      - mercaldas_internal

networks:
  mercaldas_internal:
    external: true

volumes:
  postgres_data: