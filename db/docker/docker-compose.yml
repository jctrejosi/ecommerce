name: db

services:
  postgres:
    image: postgis/postgis:16-3.4

    container_name: ecommerce_postgres

    restart: unless-stopped

    # Solo local: la BD se consume desde la red interna (mercaldas_internal).
    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: