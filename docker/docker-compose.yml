# Contenedor ÚNICO de Mercaldas (backend + bot + interfaces web + Caddy).
# Solo se publican 80/443: backend y bot escuchan en 127.0.0.1 dentro del
# contenedor (en :3100/:8001) y la base de datos vive en la red interna (nunca
# publicada). El proceso NO corre como root: Caddy escucha en :8080/:8443 y el
# compose los publica como 80/443.
#
# Uso:
#   cp docker/.env.example docker/.env   # edita dominios, TLS y secretos
#   docker compose -f docker/docker-compose.yml build --build-arg VITE_API_URL=https://api.tudominio.com
#   docker compose -f docker/docker-compose.yml up -d
#
# Guía completa (incluye Windows Server, firewall y DNS): docs/DESPLIEGUE-DOCKER.md
name: mercaldas

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Debe coincidir con https://${HOST_API}. Se hornea en los fronts.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    image: mercaldas/app:latest
    env_file:
      - .env
    environment:
      BACKEND_PORT: "3100"
      BOT_PORT: "8001"
      # Puertos internos de Caddy (no root); el host publica 80/443.
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
      # Detrás de Caddy: confiar en X-Forwarded-For para el rate limit por IP.
      TRUST_PROXY: "loopback"
      RATE_LIMIT_ENABLED: "true"
      # Certificados/estado de Caddy → volúmenes (no se re-emiten en cada up).
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
      CADDYFILE_OUT: /config/Caddyfile.generated
    # Solo el proxy sale al exterior. Cambia los puertos del host si 80/443
    # ya están ocupados (p. ej. "8080:8080"). El bind a 0.0.0.0 es el necesario
    # para exponer; limita el acceso con el firewall del servidor.
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:8080"
      - "${PUBLIC_HTTPS_PORT:-443}:8443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Medios locales del backend (fallback sin Cloudinary): persisten.
      - media:/app/db
    networks:
      - edge      # salida a internet (DeepSeek, Cloudinary, ACME…) y puertos publicados
      - internal  # red interna (BD/ERP) — no publicada
    # Endurecimiento: sin capacidades extra y sin escalada de privilegios. Al
    # correr como usuario sin privilegios en puertos altos no hace falta
    # NET_BIND_SERVICE.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3100/api-status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Evita que los logs llenen el disco (el backend registra cada petición).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

networks:
  edge:
    name: mercaldas_edge
  internal:
    name: mercaldas_internal
    internal: true

volumes:
  caddy_data:
    name: mercaldas_caddy_data
  caddy_config:
    name: mercaldas_caddy_config
  media:
    name: mercaldas_media
