# Contenedor ÚNICO de Mercaldas (backend + bot + interfaces web + Caddy).
# Solo se publican 80/443: backend y bot escuchan en 127.0.0.1 dentro del
# contenedor (en :3100/:8001) y la base de datos vive en la red interna (nunca
# publicada). El proceso NO corre como root: Caddy escucha en :8080/:8443 y el
# compose los publica como 80/443.
#
# Uso:
#   cp docker/.env.example docker/.env   # edita dominios, TLS y secretos
#   docker compose -f docker/docker-compose.yml build --build-arg VITE_API_URL=https://api.tudominio.com
#   docker compose -f docker/docker-compose.yml up -d
#
# Guía completa (incluye Windows Server, firewall y DNS): docs/DESPLIEGUE-DOCKER.md
name: mercaldas

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Debe coincidir con https://${HOST_API}. Se hornea en los fronts.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    image: mercaldas/app:latest
    # Nombre fijo: el edge compartido (docker/edge/) alcanza este contenedor por
    # nombre en la red `shared_edge`.
    container_name: mercaldas_app
    env_file:
      - .env
    environment:
      BACKEND_PORT: "3100"
      BOT_PORT: "8001"
      # Puertos internos de Caddy (no root); el host publica los de abajo.
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
      # Detrás de Caddy: confiar en X-Forwarded-For para el rate limit por IP.
      # `uniquelocal` cubre el salto extra del edge compartido (red Docker
      # privada → el backend resuelve la IP real del cliente).
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      RATE_LIMIT_ENABLED: "true"
      # Certificados/estado de Caddy → volúmenes (no se re-emiten en cada up).
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
      CADDYFILE_OUT: /config/Caddyfile.generated
    # ── Puertos publicados en el host ──────────────────────────────────────
    # Por defecto SOLO en loopback y en puertos propios (30180/30181), para no
    # chocar con 80/443 ni con servicios «genéricos» (8080, 8443…). Pensados
    # para el despliegue con EDGE COMPARTIDO (docker/edge/), que es el único
    # que publica 80/443 y termina TLS.
    # Modo directo (este contenedor es el único en el servidor): pon en
    # docker/.env  PUBLIC_HTTP_PORT=80  PUBLIC_HTTPS_PORT=443  (y TLS=true).
    ports:
      - "${PUBLIC_HTTP_PORT:-127.0.0.1:30180}:8080"
      - "${PUBLIC_HTTPS_PORT:-127.0.0.1:30181}:8443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Medios locales del backend (fallback sin Cloudinary): persisten.
      - media:/app/db
    networks:
      - edge      # salida a internet (DeepSeek, Cloudinary, ACME…) y puertos publicados
      - internal  # red interna (BD/ERP) — no publicada
      - shared_edge  # la usa el edge compartido (docker/edge/) para alcanzar este contenedor
    # Endurecimiento: sin capacidades extra y sin escalada de privilegios. Al
    # correr como usuario sin privilegios en puertos altos no hace falta
    # NET_BIND_SERVICE.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3100/api-status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Evita que los logs llenen el disco (el backend registra cada petición).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

networks:
  edge:
    name: mercaldas_edge
  internal:
    name: mercaldas_internal
    internal: true
  # Red que comparte con el edge compartido (docker/edge/) cuando 80/443 los
  # publica ESE contenedor en vez de este. La crea el proyecto al arrancar.
  shared_edge:
    name: shared_edge

volumes:
  caddy_data:
    name: mercaldas_caddy_data
  caddy_config:
    name: mercaldas_caddy_config
  media:
    name: mercaldas_media
