# Contenedor ÚNICO de Mercaldas (backend + bot + interfaces web + Caddy).
# Solo se publican 80/443: backend y bot escuchan en 127.0.0.1 dentro del
# contenedor y la base de datos vive en la red interna (nunca publicada).
#
# Uso:
#   cp docker/.env.example docker/.env   # edita dominios, TLS y secretos
#   docker compose -f docker/docker-compose.yml build --build-arg VITE_API_URL=https://api.tudominio.com
#   docker compose -f docker/docker-compose.yml up -d
#
# Guía completa (incluye Windows Server, firewall y DNS): docs/DESPLIEGUE-DOCKER.md
name: mercaldas

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Debe coincidir con https://${HOST_API}. Se hornea en los fronts.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    image: mercaldas/app:latest
    env_file:
      - .env
    environment:
      BACKEND_PORT: "3100"
      BOT_PORT: "8001"
      # Certificados/estado de Caddy → volúmenes (no se re-emiten en cada up).
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    # Solo el proxy sale al exterior. Cambia los puertos del host si 80/443
    # ya están ocupados (p. ej. "8080:80"). El bind a 0.0.0.0 es el necesario
    # para exponer; limita el acceso con el firewall del servidor.
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge      # salida a internet (DeepSeek, Cloudinary, ACME…) y puertos publicados
      - internal  # red interna (BD/ERP) — no publicada
    # Endurecimiento: sin nuevas capacidades y con la mínima para escuchar en <1024.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3100/api-status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

networks:
  edge:
    name: mercaldas_edge
  internal:
    name: mercaldas_internal
    internal: true

volumes:
  caddy_data:
    name: mercaldas_caddy_data
  caddy_config:
    name: mercaldas_caddy_config
