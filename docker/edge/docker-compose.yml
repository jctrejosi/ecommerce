# Edge compartido: el ÚNICO contenedor que publica 80/443.
#
# Termina TLS para todos los dominios desplegados en este servidor y reenvía a
# cada contenedor de aplicación por la red Docker `shared_edge`:
#   - ecommerce → mercaldas_app:8080      (su Caddy interno sirve HTTP en :8080)
#
# TLS: certificado de ORIGEN de Cloudflare (ver Caddyfile y README). El
# certificado y su llave viven FUERA del repo, en /etc/mercaldas/edge-tls, y se
# montan de solo lectura. Sin proxy de Cloudflare delante, el navegador no
# confía en esa CA.
#
# Requisitos:
#   1. El proyecto correspondiente debe estar arriba al menos una vez (crea la
#      red `shared_edge` al arrancar).
#   2. El DNS de los dominios del `Caddyfile` debe apuntar a este servidor.
#
# Uso:
#   docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.yml logs -f
name: edge

services:
  caddy:
    image: caddy:2.11.7
    container_name: edge_caddy
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificado de origen + llave (600, root). Se gestionan en el host.
      - /etc/mercaldas/edge-tls:/etc/caddy/edge-tls:ro
      - edge_data:/data
      - edge_config:/config
    networks:
      - shared_edge
    # Escucha en 80/443 (privilegiados) → se le da SOLO esa capacidad.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  # La crean los proyectos al arrancar (docker/docker-compose.yml de cada uno).
  shared_edge:
    external: true
    name: shared_edge

volumes:
  edge_data:
    name: edge_caddy_data
  edge_config:
    name: edge_caddy_config
