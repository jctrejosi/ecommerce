# Edge compartido: el ÚNICO contenedor que publica 80/443.
#
# Termina TLS (Let's Encrypt) para TODOS los dominios de los dos proyectos
# (ecommerce y CRM) y reenvía a cada contenedor de aplicación por la red Docker
# `shared_edge`:
#   - ecommerce → mercaldas_app:8080      (su Caddy interno sirve HTTP en :8080)
#   - CRM       → mercaldas_crm_app:8080  (idem)
#
# Así cada proyecto conserva sus puertos PROPIOS (30180/30181 y 30280/30281, solo
# en loopback) sin chocar con 80/443 ni con ningún servicio «genérico».
#
# Requisitos:
#   1. Los dos proyectos deben estar arriba al menos una vez (el CRM y el
#      ecommerce crean la red `shared_edge` al arrancar).
#   2. El DNS de TODOS los dominios del `Caddyfile` debe apuntar a este servidor
#      (Let's Encrypt los valida por HTTP-01 en el puerto 80).
#
# Uso:
#   docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.yml logs -f
name: edge

services:
  caddy:
    image: caddy:2.11.7
    container_name: edge_caddy
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - edge_data:/data
      - edge_config:/config
    networks:
      - shared_edge
    # Escucha en 80/443 (privilegiados) → se le da SOLO esa capacidad.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  # La crean los proyectos al arrancar (docker/docker-compose.yml de cada uno).
  shared_edge:
    external: true
    name: shared_edge

volumes:
  edge_data:
    name: edge_caddy_data
  edge_config:
    name: edge_caddy_config
