# Servidor estático de cada SPA (contenedores ecommerce_client/admin/delivery/picking).
# nginx-unprivileged escucha en 8080 y no corre como root.
#
# Las cabeceras de seguridad (CSP, HSTS, X-Frame-Options…) las añade el Caddy
# interno (`ecommerce_proxy`), que es el único que recibe tráfico del edge.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Healthcheck del contenedor.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets con hash: inmutables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El HTML nunca se cachea: un index viejo apunta a bundles viejos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta desconocida cae en index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
